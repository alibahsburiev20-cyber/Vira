name: Build Vira APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Copy app icons into Android resources
        run: |
          mkdir -p android/app/src/main/res/mipmap-mdpi
          mkdir -p android/app/src/main/res/mipmap-hdpi
          mkdir -p android/app/src/main/res/mipmap-xhdpi
          mkdir -p android/app/src/main/res/mipmap-xxhdpi
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          cp android-assets/icon-48.png  android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp android-assets/icon-48.png  android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          cp android-assets/icon-48.png  android/app/src/main/res/mipmap-mdpi/ic_launcher_foreground.png
          cp android-assets/icon-72.png  android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp android-assets/icon-72.png  android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp android-assets/icon-72.png  android/app/src/main/res/mipmap-hdpi/ic_launcher_foreground.png
          cp android-assets/icon-96.png  android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp android-assets/icon-96.png  android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp android-assets/icon-96.png  android/app/src/main/res/mipmap-xhdpi/ic_launcher_foreground.png
          cp android-assets/icon-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp android-assets/icon-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp android-assets/icon-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_foreground.png
          cp android-assets/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp android-assets/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp android-assets/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Grant execute permission to gradlew
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: vira-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
